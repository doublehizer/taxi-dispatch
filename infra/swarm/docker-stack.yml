# Развёртывание системы в кластере Docker Swarm.
# Выполняется на управляющем узле (manager):
#   REGISTRY=ghcr.io/<логин> TAG=latest docker stack deploy -c docker-stack.yml --with-registry-auth taxi
# Подробнее — infra/swarm/deploy.sh

x-app-env: &app-env
  POSTGRES_HOST: postgres
  POSTGRES_DB: taxi
  POSTGRES_USER: taxi
  POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
  REDIS_HOST: redis
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: taxi
  RABBITMQ_PASSWORD: taxi
  DISPATCH_RETRY_DELAY_MS: "5000"

# Общие правила развёртывания прикладных сервисов
x-app-deploy: &app-deploy
  replicas: 2
  placement:
    constraints:
      - node.labels.tier != data
    preferences:
      - spread: node.id
  update_config:
    parallelism: 1
    delay: 10s
    order: start-first
    failure_action: rollback
    monitor: 20s
  rollback_config:
    parallelism: 1
    order: stop-first
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 5
    window: 60s
  resources:
    limits:
      cpus: "0.50"
      memory: 256M
    reservations:
      memory: 64M

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------- Точка входа ----------
  traefik:
    image: traefik:v3.6
    command:
      - --providers.swarm=true
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
      - --metrics.prometheus=true
      - --accesslog=true
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 8080
        published: 8080
        protocol: tcp
        mode: ingress
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [edge, backend]
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
    logging: *logging

  web:
    image: ${REGISTRY:?Задайте REGISTRY}/taxi-web:${TAG:-latest}
    networks: [edge]
    deploy:
      <<: *app-deploy
      labels:
        - traefik.enable=true
        - traefik.swarm.network=taxi_edge
        - traefik.http.routers.web.rule=PathPrefix(`/`)
        - traefik.http.routers.web.priority=1
        - traefik.http.routers.web.entrypoints=web
        - traefik.http.services.web.loadbalancer.server.port=80
    logging: *logging

  # ---------- Прикладные сервисы ----------
  auth-service:
    image: ${REGISTRY}/taxi-auth-service:${TAG:-latest}
    environment:
      <<: *app-env
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      DISPATCHER_PASSWORD_FILE: /run/secrets/dispatcher_password
    secrets: [pg_password, jwt_secret, admin_password, dispatcher_password]
    networks: [backend, data]
    deploy:
      <<: *app-deploy
      labels:
        - traefik.enable=true
        - traefik.swarm.network=taxi_backend
        - traefik.http.routers.auth.rule=PathPrefix(`/api/auth`)
        - traefik.http.routers.auth.entrypoints=web
        - traefik.http.routers.auth.middlewares=strip-api
        - traefik.http.services.auth.loadbalancer.server.port=8000
        - traefik.http.middlewares.auth-check.forwardauth.address=http://auth-service:8000/auth/verify
        - traefik.http.middlewares.auth-check.forwardauth.authResponseHeaders=X-User,X-Role
    logging: *logging

  order-service:
    image: ${REGISTRY}/taxi-order-service:${TAG:-latest}
    environment:
      <<: *app-env
      DRIVER_SERVICE_URL: http://driver-service:8000
    secrets: [pg_password]
    networks: [backend, data]
    deploy:
      <<: *app-deploy
      labels:
        - traefik.enable=true
        - traefik.swarm.network=taxi_backend
        - traefik.http.routers.orders.rule=PathPrefix(`/api/orders`)
        - traefik.http.routers.orders.entrypoints=web
        - traefik.http.routers.orders.middlewares=auth-check,strip-api
        - traefik.http.middlewares.strip-api.stripprefix.prefixes=/api
        - traefik.http.services.orders.loadbalancer.server.port=8000
        - traefik.http.services.orders.loadbalancer.healthcheck.path=/health
        - traefik.http.services.orders.loadbalancer.healthcheck.interval=10s
    logging: *logging

  driver-service:
    image: ${REGISTRY}/taxi-driver-service:${TAG:-latest}
    environment:
      <<: *app-env
    secrets: [pg_password]
    networks: [backend, data]
    deploy:
      <<: *app-deploy
      labels:
        - traefik.enable=true
        - traefik.swarm.network=taxi_backend
        - traefik.http.routers.drivers.rule=PathPrefix(`/api/drivers`)
        - traefik.http.routers.drivers.entrypoints=web
        - traefik.http.routers.drivers.middlewares=auth-check,strip-api
        - traefik.http.services.drivers.loadbalancer.server.port=8000
        - traefik.http.services.drivers.loadbalancer.healthcheck.path=/health
        - traefik.http.services.drivers.loadbalancer.healthcheck.interval=10s
    logging: *logging

  dispatch-service:
    image: ${REGISTRY}/taxi-dispatch-service:${TAG:-latest}
    environment:
      <<: *app-env
      DISPATCH_MAX_ATTEMPTS: "6"
      DISPATCH_PREFETCH: "5"
    secrets: [pg_password]
    networks: [backend, data]
    deploy:
      <<: *app-deploy
      replicas: 3
    logging: *logging

  simulator:
    image: ${REGISTRY}/taxi-simulator:${TAG:-latest}
    environment:
      ORDER_API_URL: http://order-service:8000
      DRIVER_API_URL: http://driver-service:8000
      SIM_DRIVERS: "30"
      SIM_ORDER_INTERVAL: "3"
    networks: [backend]
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
    logging: *logging

  # ---------- Хранилища (закреплены за узлом с меткой tier=data) ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taxi
      POSTGRES_USER: taxi
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets: [pg_password]
    configs:
      - source: pg_init
        target: /docker-entrypoint-initdb.d/init.sql
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxi -d taxi"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [data]
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.tier == data
      resources:
        limits:
          memory: 512M
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [data]
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.tier == data
      resources:
        limits:
          memory: 128M
    logging: *logging

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: taxi
      RABBITMQ_DEFAULT_PASS: taxi
    configs:
      - source: rabbit_plugins
        target: /etc/rabbitmq/enabled_plugins
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    ports:
      - target: 15672
        published: 15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend, data]
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.tier == data
      resources:
        limits:
          memory: 512M
    logging: *logging

  # ---------- Мониторинг ----------
  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - promdata:/prometheus
    ports:
      - target: 9090
        published: 9090
    networks: [backend]
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
    logging: *logging

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/taxi.json
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yml
      - source: grafana_dashboards_provider
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
      - source: grafana_dashboard_taxi
        target: /var/lib/grafana/dashboards/taxi.json
    volumes:
      - grafanadata:/var/lib/grafana
    networks: [edge, backend]
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.swarm.network=taxi_edge
        - traefik.http.routers.grafana.rule=PathPrefix(`/grafana`)
        - traefik.http.routers.grafana.entrypoints=web
        - traefik.http.services.grafana.loadbalancer.server.port=3000
    logging: *logging

networks:
  edge:
    name: taxi_edge
    driver: overlay
  backend:
    name: taxi_backend
    driver: overlay
    attachable: true
  data:
    name: taxi_data
    driver: overlay
    internal: true

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  promdata:
  grafanadata:

secrets:
  pg_password:
    external: true
  jwt_secret:
    external: true
  admin_password:
    external: true
  dispatcher_password:
    external: true

configs:
  pg_init:
    file: ../../db/init.sql
  rabbit_plugins:
    file: ../rabbitmq/enabled_plugins
  prometheus_config:
    file: ../prometheus/prometheus.swarm.yml
  grafana_datasource:
    file: ../grafana/provisioning/datasources/prometheus.yml
  grafana_dashboards_provider:
    file: ../grafana/provisioning/dashboards/dashboards.yml
  grafana_dashboard_taxi:
    file: ../grafana/dashboards/taxi.json
