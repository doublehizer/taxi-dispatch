[project]
name = "taxi-dispatch"
version = "1.0.0"
description = "Система автоматической обработки и распределения заказов для службы такси"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = [
    "common",
    "services/order-service",
    "services/driver-service",
    "services/dispatch-service",
    "services/auth-service",
    "services/simulator",
]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["taxi_common", "order_service", "driver_service", "dispatch_service", "auth_service"]
